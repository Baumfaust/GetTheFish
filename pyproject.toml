[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "getthefish"
dynamic = ["version"]
description = "Colour-based fishing automation with a small PySide6 GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Baumfaust" }]
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2",
    "numpy>=2.5.4",
    "pyautogui>=0.9.54",
    "PySide6>=6.12",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-qt>=4.5",
    "PySide6-stubs>=6.7.3.0",
    "ruff>=0.17",
]
build = ["pyinstaller>=6.22"]

[project.scripts]
getthefish = "getthefish.__main__:main"

[project.gui-scripts]
getthefish-gui = "getthefish.gui.main_window:main"

[tool.hatch.version]
path = "src/getthefish/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/getthefish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --cov=getthefish --cov-report=term-missing"
qt_api = "pyside6"

[tool.coverage.run]
branch = true
omit = ["*/gui/ui_main.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/getthefish/gui/ui_main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "S"]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "PT018",  # compound range assertions read better
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["getthefish", "helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["tests"]
exclude = ["src/getthefish/gui/ui_main\\.py$"]

[[tool.mypy.overrides]]
module = ["getthefish.gui.ui_main"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["test_gui"]
disallow_untyped_calls = false  # pytest-qt's QtBot is untyped

[[tool.mypy.overrides]]
module = ["pyautogui", "mss", "pytestqt.*"]
ignore_missing_imports = true
